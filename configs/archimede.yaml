# Archimede local agent awareness configuration
daemon:
  poll_interval_ms: 2000
  bucket_secs: 30
  data_dir: "~/.local/share/archimede"
  bind: "127.0.0.1:7432"
  enable_ebpf: false
  # Built SolidJS UI (`cd dashboard && npm run build`)
  dashboard_dir: "dashboard/dist"
  # Optional: required for POST /v1/clear and for ingest when enforcement is on.
  # api_token: "change-me"

# Watch agent CWDs for create / edit / delete file logs (also inferred from tool spans).
file_watch:
  enabled: true
  max_depth: 4
  max_events_per_scan: 80
  roots: []
  ignore_dirs:
    - .git
    - node_modules
    - target
    - dist
    - build
    - .venv
    - venv
    - __pycache__
    - .next
    - .cache

# Observe + alert by default. Set enabled: true to allow kill/deny actions.
# When enabled, set daemon.api_token so span ingest cannot be abused.
enforcement:
  enabled: false
  actions: [terminate_process]
  cool_down_secs: 60

policy:
  max_span_egress_hosts: 8
  flag_on_secret_patterns: true
  flag_on_prompt_injection: true
  flag_on_remote_control: true
  flag_dangerous_tools: true
  flag_on_resource_spike_pct: 300
  # Hard deny (may terminate when enforcement.enabled):
  deny_tools: []
  # Extra names merged with builtins (bash/shell/curl/exec/…):
  warn_tools: []
  allow_models: []

attribution:
  agents:
    - name: cursor
      family: coding_agent
      match: ["cursor", "Cursor"]
    - name: claude-code
      family: coding_agent
      match: ["claude-code", "claude code", "@anthropic-ai/claude"]
    - name: copilot
      family: coding_agent
      match: ["copilot", "github-copilot"]
    - name: windsurf
      family: coding_agent
      match: ["windsurf", "Cascade"]
    - name: aider
      family: coding_agent
      match: ["aider"]
    - name: continue
      family: coding_agent
      match: ["continue-server", "continue.dev"]
    - name: zed-agent
      family: coding_agent
      match: ["zed-agent"]
    - name: amp
      family: coding_agent
      match: ["amp-cli", "sourcegraph-amp"]
    - name: codex
      family: coding_agent
      match: ["codex", "openai-codex"]
    - name: openclaw
      family: harness
      match: ["openclaw"]
    - name: hermes
      family: harness
      match: ["hermes"]
    - name: pi
      family: harness
      match: ["pi-agent", "pi_agent"]
    - name: langchain
      family: harness
      match: ["langchain", "langgraph"]
    - name: llama-index
      family: harness
      match: ["llama-index", "llamaindex"]
    - name: crewai
      family: harness
      match: ["crewai"]
    - name: autogen
      family: harness
      match: ["autogen", "ag2"]
    - name: semantic-kernel
      family: harness
      match: ["semantic-kernel", "semantickernel"]
    - name: dspy
      family: harness
      match: ["dspy"]
    - name: haystack
      family: harness
      match: ["haystack"]
    - name: ollama
      family: local_llm
      match: ["ollama"]
    - name: llama-server
      family: local_llm
      match: ["llama-server", "llama.cpp"]
    - name: vllm
      family: local_llm
      match: ["vllm"]
    - name: lmstudio
      family: local_llm
      match: ["lmstudio", "LM Studio"]
    - name: kobold
      family: local_llm
      match: ["koboldcpp", "kobold"]
    - name: text-generation-webui
      family: local_llm
      match: ["text-generation-webui", "oobabooga"]
    - name: mlx
      family: local_llm
      match: ["mlx_lm", "mlx-lm"]
    - name: openai-node
      family: cloud_bridge
      match: ["openai"]
    - name: anthropic
      family: cloud_bridge
      match: ["anthropic"]
    - name: gemini
      family: cloud_bridge
      match: ["gemini", "google-generativeai"]

session_logs:
  paths:
    - "~/.cursor"
    - "~/.claude"
    - "~/.config/github-copilot"
    - "~/.codex"
    - "~/.aider"
    - "~/.continue"
    - "~/.codeium"

classify:
  endpoint: "http://127.0.0.1:9931/v1/systemone"
  model: "ggml-org/Julia-1-GGUF:BF16"
  timeout_ms: 5000
  fallback_rules: true
  labels:
    - idle
    - planning
    - coding
    - testing
    - shell_tools
    - browsing
    - llm_wait
    - risky_egress

forecast:
  model_size: "5M" # 5M | 28M
  context_len: 256
  horizon: 16
  onnx_path: null
  sidecar_url: null

alerts:
  egress_bytes_per_bucket: 50000000
  exec_rate_per_bucket: 40
  delete_rate_per_bucket: 20
  risk_score_threshold: 0.7
