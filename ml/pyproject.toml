[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "archimede-ml"
version = "0.1.0"
description = "Validation and fine-tuning scripts for Archimede System-One and Timestral models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "rich>=13.0",
  "typer>=0.12",
]

[project.optional-dependencies]
timestral = [
  "torch>=2.4",
  "safetensors>=0.4",
  "huggingface_hub>=0.24",
]
onnx = [
  "onnx>=1.16",
  "onnxruntime>=1.18",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
archimede-ml = "archimede_ml.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["archimede_ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
